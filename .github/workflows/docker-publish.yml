name: Publish Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get actual-app-cli version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@actual-app/cli']")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get lowercase repository owner
        id: repo_owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$OWNER_LOWER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.name }}/node-actual-app-cli:latest
            ghcr.io/${{ steps.repo_owner.outputs.name }}/node-actual-app-cli:${{ steps.version.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            Docker image published to ghcr.io/${{ steps.repo_owner.outputs.name }}/node-actual-app-cli:${{ steps.version.outputs.version }}
            
            Using @actual-app/cli version: ${{ steps.version.outputs.version }}
